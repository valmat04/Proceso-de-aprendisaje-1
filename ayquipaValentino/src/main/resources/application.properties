spring.application.name=ayquipaValentino
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDParcialAyquipa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET}
app.inspector.username=${INSPECTOR_USERNAME:inspector}
app.inspector.password=${INSPECTOR_PASSWORD}
app.demo.seed=${DEMO_SEED:false}
server.error.include-message=never
